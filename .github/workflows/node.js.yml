name: Node.js CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Check for Node package manifest
        shell: bash
        run: |
          if [ -f package.json ]; then
            echo "package.json found. Continuing with Node-based validation."
          else
            echo "No package.json found in the repository root. This project appears to be a static HTML/JS site, so npm validation is skipped."
            exit 0
          fi

      - name: Use Node.js 22.x
        if: hashFiles('package.json') != ''
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'npm'

      - name: Install dependencies
        if: hashFiles('package.json') != ''
        run: npm ci

      - name: Build project
        if: hashFiles('package.json') != ''
        run: npm run build --if-present

      - name: Run tests
        if: hashFiles('package.json') != ''
        run: npm test --if-present
